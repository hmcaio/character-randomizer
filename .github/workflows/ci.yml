name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:
    inputs:
      ref:
        description: Git ref to check out (the release workflow passes the tag)
        type: string
        default: ''

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Always runs and is the required check on main. Lint, the full Vitest suite
  # (which includes the game-data tests) and the production build.
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: character-randomizer/package-lock.json
      - run: npm ci
        working-directory: character-randomizer
      - run: npm run lint
        working-directory: character-randomizer
      - run: npm test
        working-directory: character-randomizer
      - run: npm run build
        working-directory: character-randomizer
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: character-randomizer/dist
          if-no-files-found: error
          retention-days: 7

  # Preview channel for PRs from this repo. Dependabot PRs cannot read secrets,
  # and forks never can.
  preview:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: character-randomizer/dist
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHARACTER_RANDOMIZER }}
          projectId: character-randomizer
          target: app
