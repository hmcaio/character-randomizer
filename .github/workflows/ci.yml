name: CI

# Orchestrator. Decides which pipeline a PR needs and exposes one always-running
# job named "ci", the required check on main. Path filters live here, never on a
# workflow's own triggers: a workflow skipped by a filter leaves its check pending
# and would block the PR.
#
#   app  = any file outside game-data/            -> app.yml  (lint, test, build, preview)
#   data = any file under game-data/public/       -> data.yml (data tests, data preview)
#
# Push to main always runs the app pipeline. Tags go through release.yml.
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
      data: ${{ steps.filter.outputs.data }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.number }}
        run: |
          app=false
          data=false
          if [ "$EVENT" != pull_request ]; then
            app=true
          else
            files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate \
              --jq '.[] | .filename, (.previous_filename // empty)')
            echo "$files"
            while IFS= read -r f; do
              case "$f" in
                game-data/public/*) data=true ;;
                game-data/*) ;;
                *) app=true ;;
              esac
            done <<<"$files"
          fi
          echo "app=$app data=$data"
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "data=$data" >> "$GITHUB_OUTPUT"

  app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    uses: ./.github/workflows/app.yml
    # A called workflow may not ask for more than its caller grants.
    permissions:
      contents: read
      checks: write
      pull-requests: write

  data:
    needs: changes
    if: needs.changes.outputs.data == 'true'
    uses: ./.github/workflows/data.yml
    permissions:
      contents: read
      checks: write
      pull-requests: write

  # Required check. Skipped pipelines count as passed; a failed or cancelled one,
  # or a failed `changes` job, fails the gate.
  ci:
    needs: [changes, app, data]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
