name: Deploy Game Data to Firebase Hosting
on:
  push:
    branches:
      - main
    paths:
      - 'game-data/public/**'
jobs:
  deploy_data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cd character-randomizer && npm ci && npx vitest run src/test/data
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHARACTER_RANDOMIZER }}
          channelId: live
          projectId: character-randomizer
          target: data
