name: Data

# Reusable. Validates game-data/public with the data tests and deploys a preview
# channel of the "data" Firebase Hosting site for the PR. Production data deploys
# on merge through firebase-hosting-data-deploy.yml.
on:
  workflow_call:
    outputs:
      url:
        description: URL of the data preview channel (empty when no preview was deployed)
        value: ${{ jobs.preview.outputs.url }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: character-randomizer/package-lock.json
      - run: npm ci
        working-directory: character-randomizer
      - run: npx vitest run src/test/data
        working-directory: character-randomizer

  # Same conditions as the app preview: Dependabot PRs and forks cannot read secrets.
  preview:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.details_url }}
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - id: deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHARACTER_RANDOMIZER }}
          projectId: character-randomizer
          target: data
